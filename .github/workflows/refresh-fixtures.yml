name: Refresh fixtures

# Re-records test/fixtures/ against the live API once a week and publishes the
# difference as a report. It never commits, pushes or opens a pull request:
# a person reads the report and decides whether the API change is expected.
#
# Needs the repository secret ER_API_KEY (an Event Registry API key).

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-fixtures
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    env:
      ER_API_KEY: ${{ secrets.ER_API_KEY }}
    steps:
      - name: Require the API key secret
        run: |
          if [ -z "$ER_API_KEY" ]; then
            echo "::error::Repository secret ER_API_KEY is not set; create it to enable this job."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Write settings.json
        run: node -e 'require("fs").writeFileSync("settings.json", JSON.stringify({ apiKey: process.env.ER_API_KEY }))'
      - name: Record fixtures
        id: record
        run: npm run test:record
        continue-on-error: true
      - name: Build the diff report
        run: |
          rm -f settings.json
          mkdir -p report
          git add --intent-to-add test/fixtures
          git diff --stat -- test/fixtures > report/summary.txt
          git diff -- test/fixtures > report/fixtures.patch
          {
            echo "## Fixture refresh"
            echo
            echo "Recording step: ${{ steps.record.outcome }}"
            echo
            if [ -s report/summary.txt ]; then
              echo '```'
              cat report/summary.txt
              echo '```'
              echo
              echo "Download the \`fixture-diff\` artifact, review \`fixtures.patch\` and apply it with \`git apply\` if the change is expected."
            else
              echo "No fixture changes."
            fi
          } | tee report/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fixture-diff
          path: report/
          if-no-files-found: error
      - name: Fail when recording failed
        if: steps.record.outcome == 'failure'
        run: exit 1
